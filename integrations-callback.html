<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Predictable.ai — Conectando integración…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F8FA; color: #0A0A0F; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { text-align: center; max-width: 420px; padding: 0 20px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(10,10,15,0.10); border-top-color: #1F4BFF; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: rgba(10,10,15,0.55); font-size: 14px; line-height: 1.55; }
  .err { color: #D64545; margin-top: 12px; font-size: 13px; line-height: 1.55; }
  a { color: #1F4BFF; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Conectando la integración…</div>
  <div class="err" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  // Retorno del OAuth de las integraciones (js/integrations.js): HubSpot,
  // Salesforce, Google Sheets, Google Calendar, Notion y ClickUp vuelven aquí
  // con ?code=&state=. NO carga auth-guard.js: si algo falla a mitad del
  // flujo debe mostrar su error en vez de rebotar al login.
  (function () {
    var NAMES = {
      hubspot: 'HubSpot', salesforce: 'Salesforce', google_sheets: 'Google Sheets',
      google_calendar: 'Google Calendar', notion: 'Notion', clickup: 'ClickUp'
    };
    var msg = document.getElementById('msg');
    var err = document.getElementById('err');
    var spinner = document.getElementById('spinner');

    function fail(text) {
      spinner.style.display = 'none';
      msg.textContent = 'No se pudo conectar la integración.';
      err.textContent = text + ' ';
      var a = document.createElement('a');
      a.href = './index.html#integrations';
      a.textContent = 'Volver a Integraciones';
      err.appendChild(a);
      err.appendChild(document.createTextNode('.'));
    }

    var pending = null;
    try { pending = JSON.parse(sessionStorage.getItem('predictable_integration_oauth') || 'null'); } catch (e) {}
    try { sessionStorage.removeItem('predictable_integration_oauth'); } catch (e) {}

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var oauthError = params.get('error');

    var name = (pending && NAMES[pending.provider]) || 'la plataforma';
    msg.textContent = 'Conectando ' + name + '…';

    if (oauthError) {
      return fail(oauthError === 'access_denied'
        ? 'Cancelaste el permiso en ' + name + '.'
        : name + ' respondió: ' + (params.get('error_description') || oauthError) + '.');
    }
    if (!code) return fail(name + ' no devolvió un código de autorización.');
    // CSRF: el state que mandamos tiene que ser el que volvió.
    if (!pending || !pending.state || state !== pending.state || !NAMES[pending.provider]) {
      return fail('La verificación de seguridad falló. Inicia la conexión de nuevo desde Integraciones.');
    }

    (async function () {
      try {
        var session = await window.supabaseHelpers.getSession();
        if (!session) return fail('Tu sesión expiró. Inicia sesión y vuelve a conectar.');
        var res = await fetch(window.SUPABASE_CONFIG.url + '/functions/v1/integrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({
            action: 'connect_oauth',
            payload: {
              provider: pending.provider,
              code: code,
              code_verifier: pending.verifier || '',
              // Tiene que coincidir byte a byte con el usado para pedir el código.
              redirect_uri: window.location.origin + window.location.pathname
            }
          })
        });
        var body = await res.json().catch(function () { return null; });
        if (!res.ok) return fail((body && body.error) || ('Error ' + res.status + '.'));
        msg.textContent = name + ' conectado' + (body && body.account_label ? ' (' + body.account_label + ')' : '') + '. Volviendo a la app…';
        setTimeout(function () {
          window.location.replace('./index.html?integration=' + encodeURIComponent(pending.provider) + '#integrations');
        }, 900);
      } catch (e) {
        fail('Error inesperado: ' + (e && e.message ? e.message : e));
      }
    })();
  })();
</script>
</body>
</html>
