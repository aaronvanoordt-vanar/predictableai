<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Predictable.ai — Procesando…</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F8FA; color: #0A0A0F; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { text-align: center; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(10,10,15,0.10); border-top-color: #1F4BFF; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: rgba(10,10,15,0.55); font-size: 14px; }
  .err { color: #D64545; margin-top: 12px; font-size: 13px; }
  a { color: #1F4BFF; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="msg" id="msg">Procesando autenticación…</div>
  <div class="err" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" integrity="sha384-q36VSR1ktH2hgqgm+0LDeyqPW8CyZHSxfDSttSPm5ReOJzB+sYThmh7D4fE+jWTs" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/i18n.js?v=20261023"></script>
<script>
  // Cada paso tiene un tiempo límite: antes, si Supabase no respondía (o el
  // candado de la sesión lo tenía otra pestaña de la app), el spinner giraba
  // para siempre sin decir nada.
  (async function () {
    const msgEl = document.getElementById('msg');
    const errEl = document.getElementById('err');
    function withTimeout(promise, ms) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
      ]);
    }
    function fail(text) {
      document.querySelector('.spinner').style.display = 'none';
      msgEl.textContent = text;
      errEl.innerHTML = '<a href="#" id="retry">Reintentar</a> · Vuelve a <a href="./auth.html">iniciar sesión</a>.';
      document.getElementById('retry').addEventListener('click', (e) => { e.preventDefault(); location.reload(); });
    }
    const slowTimer = setTimeout(() => {
      msgEl.textContent = 'Está tardando más de lo normal… Si tienes Predictable abierto en otra pestaña, ciérrala.';
    }, 6000);

    try {
      if (!window.supabaseHelpers) { clearTimeout(slowTimer); fail('No se pudo cargar el inicio de sesión. Revisa tu conexión.'); return; }

      let session = null;
      try {
        session = await withTimeout(window.supabaseHelpers.getSession(), 15000);
        if (!session) {
          // Quizá el hash aún no se procesó; esperar un tick
          await new Promise(r => setTimeout(r, 800));
          session = await withTimeout(window.supabaseHelpers.getSession(), 10000);
        }
      } catch (e) {
        clearTimeout(slowTimer);
        fail('El inicio de sesión no respondió a tiempo.');
        return;
      }
      if (!session) {
        clearTimeout(slowTimer);
        fail('No se pudo iniciar sesión.');
        return;
      }
      // Esperar 700ms para que el trigger handle_new_user haya corrido en Supabase
      await new Promise(r => setTimeout(r, 700));

      // Route based on onboarding status.
      // New users go to the multi-step onboarding wizard; completed users go to app.
      // Si el perfil no responde a tiempo se entra igual: auth-guard.js vuelve
      // a revisar el onboarding dentro de la app y redirige si hace falta.
      let profile = null;
      try {
        const { data } = await withTimeout(window.supabaseClient
          .from('profiles')
          .select('onboarded')
          .eq('id', session.user.id)
          .maybeSingle(), 10000);
        profile = data;
        if (!profile || !profile.onboarded) {
          window.location.replace('./onboarding.html');
          return;
        }
      } catch (e) {
        console.warn('[auth-callback] perfil sin respuesta, entrando a la app', e);
      }

      // /miforms/ (Hub calibration survey) is optional — it's offered as a
      // dismissible popup with a credit reward inside the app, not a gate
      // blocking entry. See js/miforms-prompt.js.
      window.location.replace(window.APP_URL || './index.html');
    } catch (e) {
      clearTimeout(slowTimer);
      fail('Error: ' + e.message);
    }
  })();
</script>
</body>
</html>
