<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Portal del cliente — predictable.ai</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F6F7F9; --surface3:#ECEEF3;
  --hair:rgba(10,10,15,0.07); --hair-3:rgba(10,10,15,0.13);
  --ink:#0A0A0F; --ink-2:rgba(10,10,15,0.78); --ink-3:rgba(10,10,15,0.55); --ink-4:rgba(10,10,15,0.40);
  --accent:#1F4BFF; --accent-ink:#1A3FD6; --accent-soft:rgba(31,75,255,0.10); --accent-soft-2:rgba(31,75,255,0.05);
  --green:#0EA968; --green-soft:rgba(14,169,104,0.11);
  --red:#D64545; --red-soft:rgba(214,69,69,0.10);
  --amber:#B87514; --amber-soft:rgba(184,117,20,0.11);
  --r:10px; --r-sm:6px; --r-lg:14px;
  --shadow-1:0 1px 2px rgba(10,10,15,0.04);
  --shadow-2:0 1px 2px rgba(10,10,15,0.04),0 8px 24px -12px rgba(10,10,15,0.10);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.cp-wrap{max-width:960px;margin:0 auto;padding:28px 20px 64px}
.cp-center{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center}
.cp-card{background:var(--surface);border:1px solid var(--hair-3);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:28px;width:100%;max-width:420px;text-align:left}
.cp-card h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.cp-card .sub{font-size:13px;color:var(--ink-3);margin-bottom:18px}
.cp-tabs{display:flex;background:var(--surface2);border-radius:999px;padding:3px;margin-bottom:16px}
.cp-tabs button{flex:1;border:none;background:transparent;border-radius:999px;padding:7px 0;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;font-family:inherit}
.cp-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.cp-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.cp-field label{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.cp-field input{background:var(--surface2);border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit}
.cp-field input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.cp-btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.cp-btn:disabled{opacity:.6;cursor:wait}
.cp-btn-google{width:100%;border:1px solid var(--hair-3);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.cp-btn-google:hover{background:var(--surface2)}
.cp-or{display:flex;align-items:center;gap:10px;color:var(--ink-4);font-size:11px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.cp-or::before,.cp-or::after{content:"";flex:1;height:1px;background:var(--hair-3)}
#cp-auth-msg{font-size:12.5px;margin-top:10px;min-height:18px}
.cp-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.cp-brand{font-weight:800;font-size:14px;letter-spacing:-.01em}
.cp-ghost{border:1px solid var(--hair-3);background:var(--surface);color:var(--ink-2);border-radius:var(--r-sm);padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.cp-ghost:hover{background:var(--surface2)}
.cp-hero{display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.cp-hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cp-hero-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-3)}
.cp-photo{width:76px;height:76px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface2);border:1px solid var(--hair-3);flex:none;display:flex;align-items:center;justify-content:center}
.cp-photo img{width:100%;height:100%;object-fit:cover}
.cp-avatar{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;font-size:24px}
.cp-chip{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
.st-green{background:var(--green-soft);color:var(--green)}
.st-amber{background:var(--amber-soft);color:var(--amber)}
.st-gray{background:var(--surface3);color:var(--ink-3)}
.st-blue{background:var(--accent-soft);color:var(--accent-ink)}
.cp-sec{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:18px 20px;margin-bottom:16px;min-width:0}
.cp-sec h2{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.cp-cols .cp-sec{margin-bottom:0}
.cp-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.cp-metric{background:var(--surface2);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.cp-metric b{font-size:20px;font-weight:800}
.cp-metric span{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.cp-ratios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cp-ratio{background:var(--accent-soft-2);border:1px solid var(--hair);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;min-width:110px}
.cp-ratio b{font-size:16px;font-weight:800;color:var(--accent-ink)}
.cp-ratio span{font-size:10.5px;color:var(--ink-3);font-weight:600}
.cp-frame{width:100%;height:380px;border:1px solid var(--hair);border-radius:var(--r);background:var(--surface2)}
.cp-links{display:flex;flex-direction:column;gap:8px}
.cp-link{color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:none}
.cp-link:hover{text-decoration:underline}
.cp-mats{display:flex;flex-direction:column;gap:8px}
.cp-mat{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--hair);border-radius:var(--r);background:var(--surface2);font-size:13px}
.cp-mat{flex-wrap:wrap}
.cp-mat .nm{flex:1 1 120px;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cp-mat .cp-muted{flex:none;white-space:nowrap}
.cp-mat a{color:var(--accent-ink);font-weight:700;font-size:12px;text-decoration:none;flex:none}
.cp-ctys{display:flex;flex-wrap:wrap;gap:6px}
.cp-cty{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--hair-3);background:var(--surface2);font-size:12px;font-weight:600;color:var(--ink-2);font-family:inherit;cursor:pointer;transition:border-color .12s,background .12s,color .12s}
.cp-cty.is-static{cursor:default}
button.cp-cty:hover{border-color:var(--accent);color:var(--accent-ink)}
.cp-cty.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.cp-text{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.cp-muted{color:var(--ink-4);font-size:13px}
.cp-spinner{width:28px;height:28px;border:3px solid var(--hair-3);border-top-color:var(--accent);border-radius:50%;animation:cpspin .8s linear infinite}
@keyframes cpspin{to{transform:rotate(360deg)}}
/* ── Edición desde el portal ──────────────────────────────────────── */
.cp-topbar-right{display:flex;align-items:center;gap:10px}
.cp-save-ind{font-size:12px;font-weight:600;color:var(--ink-4);min-width:1px}
.cp-save-ind.is-ok{color:var(--green)}
.cp-save-ind.is-err{color:var(--red)}
.cp-note{display:flex;gap:8px;background:var(--accent-soft-2);border:1px solid var(--hair);border-radius:var(--r);padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:18px;line-height:1.55}
.cp-photo.is-editable{cursor:pointer}
.cp-photo-hint{position:absolute;inset:auto 0 0 0;background:rgba(10,10,15,.55);color:#fff;font-size:10px;text-align:center;padding:3px 0;opacity:0;transition:opacity .15s}
.cp-photo.is-editable{position:relative}
.cp-photo.is-editable:hover .cp-photo-hint{opacity:1}
.cp-ta{width:100%;min-height:96px;resize:vertical;background:var(--surface2);border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;line-height:1.55;color:var(--ink);font-family:inherit}
.cp-ta.tall{min-height:140px}
.cp-ta:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.cp-ta::placeholder{color:var(--ink-4)}
.cp-sec h2 .cp-ghost{padding:5px 10px;font-size:11.5px}
.cp-span2{grid-column:1/-1}
.cp-tag{flex:none;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:10px;font-weight:700}
.cp-mat-del{flex:none;border:1px solid var(--hair-3);background:var(--surface);color:var(--ink-3);border-radius:var(--r-sm);padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.cp-mat-del:hover{border-color:var(--red);color:var(--red)}
.cp-mat-del:disabled{opacity:.5;cursor:wait}
@media (max-width:640px){.cp-cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cp-wrap">

  <div id="cp-loading" class="cp-center">
    <div class="cp-spinner"></div>
    <div style="color:var(--ink-3);font-size:13px">Cargando tu dashboard…</div>
  </div>

  <div id="cp-auth" class="cp-center" style="display:none">
    <div class="cp-card">
      <h1>Portal del cliente</h1>
      <div class="sub">Crea tu cuenta para ver el dashboard que tu equipo de predictable.ai comparte contigo.</div>
      <button type="button" class="cp-btn-google" id="cp-google">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.4 44 30.2 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continuar con Google
      </button>
      <div class="cp-or">o con tu correo</div>
      <div class="cp-tabs">
        <button type="button" id="cp-tab-signup" class="on">Crear cuenta</button>
        <button type="button" id="cp-tab-login">Ya tengo cuenta</button>
      </div>
      <form id="cp-auth-form">
        <div class="cp-field">
          <label for="cp-email">Correo</label>
          <input id="cp-email" type="email" required autocomplete="email" placeholder="tu@empresa.com">
        </div>
        <div class="cp-field">
          <label for="cp-pass">Contraseña</label>
          <input id="cp-pass" type="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="cp-btn" id="cp-submit" type="submit">Crear cuenta y ver dashboard</button>
      </form>
      <div id="cp-auth-msg"></div>
    </div>
  </div>

  <div id="cp-error" class="cp-center" style="display:none">
    <div class="cp-card" style="text-align:center">
      <h1>No se pudo abrir el portal</h1>
      <div class="sub" id="cp-error-msg" style="margin-bottom:0"></div>
    </div>
  </div>

  <div id="cp-dashboard" style="display:none"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/client-portal.js"></script>
</body>
</html>
