<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictable.ai — Conectando WhatsApp…</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F8FA; color: #0A0A0F; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { text-align: center; max-width: 420px; padding: 0 20px; }
  .msg { color: rgba(10,10,15,0.55); font-size: 14px; line-height: 1.55; }
  .err { color: #D64545; margin-top: 12px; font-size: 13px; line-height: 1.55; }
  a { color: #1F4BFF; }
</style>
</head>
<body>
<div class="box">
  <div class="msg" id="msg">Conectando tu WhatsApp con Predictable…</div>
  <div id="out"></div>
</div>
<script>
  // Regreso de la ventana de Meta (WhatsApp, Embedded Signup sin el SDK). Solo
  // le pasa el código a la ventana de Predictable que la abrió y se cierra: el
  // canje lo hace channel-connect con este mismo redirect_uri. El código no se
  // guarda en ningún lado y esta página no carga auth-guard.js.
  (function () {
    var p = new URLSearchParams(location.search);
    var data = { type: 'predictable:meta-oauth', code: p.get('code') || '', state: p.get('state') || '', error: p.get('error') || '', error_description: p.get('error_description') || p.get('error_reason') || '' };
    // Que el código no quede en el historial del navegador.
    try { history.replaceState(null, '', location.pathname); } catch (e) { /* sin historial */ }
    var out = document.getElementById('out');
    var opener = null;
    try { opener = window.opener && !window.opener.closed ? window.opener : null; } catch (e) { opener = null; }
    if (!opener) {
      document.getElementById('msg').textContent = 'No encontramos la ventana de Predictable que abrió esta.';
      out.className = 'err';
      out.textContent = 'Cierra esta ventana y vuelve a conectar WhatsApp desde Canales → WhatsApp.';
      return;
    }
    opener.postMessage(data, location.origin);
    document.getElementById('msg').textContent = data.error ? 'Meta no completó la conexión. Puedes cerrar esta ventana.' : 'Listo. Puedes cerrar esta ventana.';
    setTimeout(function () { window.close(); }, 600);
  })();
</script>
<script src="js/i18n.js?v=20261023"></script>
</body>
</html>
