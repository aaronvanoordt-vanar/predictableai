<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Predictable.ai — Conectando Gmail…</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F8FA; color: #0A0A0F; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .box { text-align: center; max-width: 420px; padding: 0 20px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(10,10,15,0.10); border-top-color: #1F4BFF; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: rgba(10,10,15,0.55); font-size: 14px; line-height: 1.55; }
  .err { color: #D64545; margin-top: 12px; font-size: 13px; line-height: 1.55; }
  a { color: #1F4BFF; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Conectando tu buzón de Gmail…</div>
  <div class="err" id="err"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  // Landing page for Google's OAuth redirect. Deliberately does NOT load
  // auth-guard.js: it must render its own error instead of bouncing to the
  // login page when something goes wrong mid-flow.
  (async function () {
    var msg = document.getElementById('msg');
    var err = document.getElementById('err');
    var spinner = document.getElementById('spinner');

    function fail(text, withLink) {
      spinner.style.display = 'none';
      msg.textContent = 'No se pudo conectar Gmail.';
      err.innerHTML = withLink
        ? text + ' <a href="./index.html">Volver a la app</a>.'
        : text;
    }

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var oauthError = params.get('error');

    if (oauthError) {
      return fail(oauthError === 'access_denied'
        ? 'Cancelaste el permiso en Google.'
        : 'Google respondió: ' + oauthError + '.', true);
    }
    if (!code) return fail('Google no devolvió un código de autorización.', true);

    // CSRF: the state we sent must be the state that came back.
    var expected = sessionStorage.getItem('gmail_oauth_state');
    sessionStorage.removeItem('gmail_oauth_state');
    if (!expected || state !== expected) {
      return fail('La verificación de seguridad falló (state no coincide). Inicia la conexión de nuevo desde la app.', true);
    }

    try {
      var session = await window.supabaseHelpers.getSession();
      if (!session) return fail('Tu sesión expiró. Inicia sesión y vuelve a conectar Gmail.', true);

      var res = await fetch(window.SUPABASE_CONFIG.url + '/functions/v1/gmail-proxy', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + session.access_token
        },
        body: JSON.stringify({
          action: 'connect',
          payload: {
            code: code,
            // Must byte-match the redirect_uri used to get the code.
            redirect_uri: window.location.origin + window.location.pathname
          }
        })
      });
      var body = await res.json().catch(function () { return null; });
      if (!res.ok) return fail((body && body.error) || ('Error ' + res.status + '.'), true);

      msg.textContent = 'Gmail conectado' + (body && body.email ? ' (' + body.email + ')' : '') + '. Volviendo a la app…';
      err.textContent = '';
      setTimeout(function () { window.location.replace('./index.html?gmail=connected#pro-main'); }, 1200);
    } catch (e) {
      fail('Error inesperado: ' + (e && e.message ? e.message : e), true);
    }
  })();
</script>
</body>
</html>
