# Despliegue manual de las edge functions.
#
# Las edge functions NO se despliegan solas al mergear (regla del repo: un
# merge a main es un deploy del frontend, no del backend). Este workflow es el
# botón para hacerlo a mano desde la pestaña Actions, sin necesidad de tener el
# repo clonado ni el CLI instalado.
#
# Requiere el secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables →
# Actions). Se saca de https://supabase.com/dashboard/account/tokens
#
# Se ejecuta sobre la rama que elijas en la UI de Actions, así que sirve para
# probar una rama antes de mergearla.
#
# Integraciones (2026-09-23): integrations (nueva, CON JWT). Secrets opcionales
#   HUBSPOT_/SALESFORCE_/NOTION_/CLICKUP_CLIENT_ID + _CLIENT_SECRET (Google usa
#   los de Gmail). Ver docs/INTEGRACIONES.md.
# Billing con Stripe (2026-09-23): billing + stripe-webhook (nuevas; la
#   segunda sale con --no-verify-jwt: Stripe la llama sin JWT y se autentica
#   por firma) + las que cambiaron de tarifario: apollo-proxy campaign-run
#   inbox-send generate-outreach generate-intel-hub schedule-intel-hub
#   generate-radar radar-plan radar-monitor generate-outreach-playbook
#   generate-campaign sales-coach. Secrets STRIPE_SECRET_KEY y
#   STRIPE_WEBHOOK_SECRET en Supabase. Ver docs/PRICING.md.
# Enriquecimiento de listas en el servidor (2026-09-23): enrich-list (nueva,
#   CON JWT; la llama pg_cron con la service role).
# Entrenamiento IA (2026-09-23): ai-training (nueva) + sales-coach,
#   generate-outreach, generate-campaign (consumen _shared/sales-training.ts).
# Bucle de aprendizaje (2026-09-19): learning-loop (nueva) + sales-coach,
#   campaign-run, generate-outreach, radar-monitor, wati-webhook, dripify-webhook
#   (consumidores y atribución por paso). Ver docs/REVENUE_OS_REVIEW.md.
# Campañas omnicanal (2026-09-03, Apollo OAuth + bandeja con respuestas):
#   channel-connect apollo-proxy campaign-run inbox-send gmail-proxy
#   wati-webhook dripify-webhook
# (las dos últimas salen con --no-verify-jwt automáticamente). Los secretos
# APOLLO_OAUTH_CLIENT_ID / APOLLO_OAUTH_CLIENT_SECRET se cargan en Supabase
# (Edge Functions → Secrets), no aquí.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funciones a desplegar, separadas por espacio. Vacío = las 6 del contexto de empresa v2.'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # El project ref no es secreto: viaja en la URL pública de la API que
          # ya está en js/config.js. Se puede sobrescribir con una repo variable.
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'yskaojvuhaqfmimwmvbi' }}
          # Por env, nunca interpolado dentro del script: ${{ inputs.* }} lo
          # escribe quien dispara el workflow, y sustituirlo en el shell sería
          # inyección de comandos.
          FUNCTIONS_INPUT: ${{ inputs.functions }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN. Añádelo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          FUNCTIONS="${FUNCTIONS_INPUT:-}"
          if [ -z "$FUNCTIONS" ]; then
            FUNCTIONS="enrich-company generate-client-brief generate-radar radar-plan radar-monitor generate-intel-hub generate-outreach generate-coda learning-loop sales-coach campaign-run"
          fi

          # Funciones que en producción corren SIN verificación de JWT porque se
          # autentican solas. Redesplegarlas sin esta bandera les cambia la
          # configuración en silencio: apollo-webhook deja de recibir los avisos
          # de Apollo, y enrich-company cambia cómo la alcanza el onboarding.
          #
          # Con JWT (no listar aquí): channel-connect, apollo-proxy, inbox-send,
          # gmail-proxy, billing, integrations, campaign-run (la llama pg_cron con la service role).
          NO_JWT="apollo-webhook enrich-company sales-coach wati-webhook dripify-webhook generate-outreach-playbook client-portal sheet-sync stripe-webhook"

          FAILED=""
          for fn in $FUNCTIONS; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::No existe supabase/functions/$fn en esta rama."
              FAILED="$FAILED $fn"
              continue
            fi

            FLAGS=""
            case " $NO_JWT " in
              *" $fn "*) FLAGS="--no-verify-jwt" ;;
            esac

            echo "::group::$fn $FLAGS"
            if npx --yes supabase@latest functions deploy "$fn" --project-ref "$PROJECT_REF" $FLAGS; then
              echo "✓ $fn desplegada"
            else
              echo "::error::Falló el deploy de $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Fallaron:$FAILED"
            exit 1
          fi
          echo "Todas las funciones se desplegaron correctamente."
