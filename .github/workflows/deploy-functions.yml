# Despliegue manual de las edge functions.
#
# Las edge functions NO se despliegan solas al mergear (regla del repo: un
# merge a main es un deploy del frontend, no del backend). Este workflow es el
# botón para hacerlo a mano desde la pestaña Actions, sin necesidad de tener el
# repo clonado ni el CLI instalado.
#
# Requiere el secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables →
# Actions). Se saca de https://supabase.com/dashboard/account/tokens
#
# Se ejecuta sobre la rama que elijas en la UI de Actions, así que sirve para
# probar una rama antes de mergearla.
#
# Desarrolladores (2026-09-23): public-api y mcp (nuevas, con --no-verify-jwt:
#   se autentican con la clave de API) + api-webhooks (nueva, CON JWT; la llama
#   pg_cron cada minuto con la service role). Migración 20260923000010 y el
#   cron de api-webhooks (SQL al final de la migración). Ver docs/API.md.
# Integraciones (2026-09-23): integrations (nueva, CON JWT). Secrets opcionales
#   HUBSPOT_/SALESFORCE_/NOTION_/CLICKUP_CLIENT_ID + _CLIENT_SECRET (Google usa
#   los de Gmail). Ver docs/INTEGRACIONES.md.
# Billing con Stripe (2026-09-23): billing + stripe-webhook (nuevas; la
#   segunda sale con --no-verify-jwt: Stripe la llama sin JWT y se autentica
#   por firma) + las que cambiaron de tarifario: apollo-proxy campaign-run
#   inbox-send generate-outreach generate-intel-hub schedule-intel-hub
#   generate-radar radar-plan radar-monitor generate-outreach-playbook
#   generate-campaign sales-coach. Secrets STRIPE_SECRET_KEY y
#   STRIPE_WEBHOOK_SECRET en Supabase. Ver docs/PRICING.md.
# Enriquecimiento de listas en el servidor (2026-09-23): enrich-list (nueva,
#   CON JWT; la llama pg_cron con la service role).
# Entrenamiento IA (2026-09-23): ai-training (nueva) + sales-coach,
#   generate-outreach, generate-campaign (consumen _shared/sales-training.ts).
# Bucle de aprendizaje (2026-09-19): learning-loop (nueva) + sales-coach,
#   campaign-run, generate-outreach, radar-monitor, wati-webhook, dripify-webhook
#   (consumidores y atribución por paso). Ver docs/REVENUE_OS_REVIEW.md.
# Campañas omnicanal (2026-09-03, Apollo OAuth + bandeja con respuestas):
#   channel-connect apollo-proxy campaign-run inbox-send gmail-proxy
#   wati-webhook dripify-webhook
# (las dos últimas salen con --no-verify-jwt automáticamente). Los secretos
# APOLLO_OAUTH_CLIENT_ID / APOLLO_OAUTH_CLIENT_SECRET se cargan en Supabase
# (Edge Functions → Secrets), no aquí.
# Migraciones (2026-10-18, pedido del dueño: «SIEMPRE aplica tú las
#   migraciones y despliega las funciones»): input `migrations` con los nombres
#   de archivo de supabase/migrations/ (separados por espacio) o `status` para
#   solo listar las que faltan. Se aplican ANTES del deploy, en orden, por la
#   Management API de Supabase (POST /v1/projects/{ref}/database/query) con el
#   mismo SUPABASE_ACCESS_TOKEN: no hace falta la contraseña de la base. Cada
#   una se registra en supabase_migrations.schema_migrations y se salta si ya
#   estaba registrada. `functions: none` = solo migraciones.
name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funciones a desplegar, separadas por espacio. Vacío = las 6 del contexto de empresa v2.'
        required: false
        default: ''
      migrations:
        description: 'Migraciones a aplicar antes del deploy (archivos de supabase/migrations/ separados por espacio), o "status" para listar las pendientes. Vacío = ninguna.'
        required: false
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'yskaojvuhaqfmimwmvbi' }}
          # Por env, nunca interpolado en el script (inyección de comandos).
          MIGRATIONS_INPUT: ${{ inputs.migrations }}
        run: |
          set -euo pipefail
          MIGRATIONS="${MIGRATIONS_INPUT:-}"
          if [ -z "$MIGRATIONS" ]; then
            echo "Sin migraciones que aplicar."
            exit 0
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          # Ejecuta SQL; imprime el JSON de respuesta. Falla con el cuerpo del error.
          run_sql() {
            local body status
            body=$(jq -Rs '{query: .}')
            status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data "$body")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "HTTP $status: $(head -c 2000 /tmp/resp.json)" >&2
              return 1
            fi
            cat /tmp/resp.json
          }

          # Historial de migraciones (lo crea el CLI de Supabase; si no existe, se crea igual).
          printf '%s' "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version text PRIMARY KEY, statements text[], name text);" | run_sql >/dev/null
          APPLIED=$(printf '%s' "SELECT version FROM supabase_migrations.schema_migrations" | run_sql | jq -r '.[].version')

          if [ "$MIGRATIONS" = "status" ]; then
            echo "Migraciones del repo que no están registradas en producción (las aplicadas a mano desde el SQL editor tampoco figuran: revísalas antes de aplicar):"
            for f in supabase/migrations/*.sql; do
              v=$(basename "$f" | cut -d_ -f1)
              grep -qx "$v" <<<"$APPLIED" || echo "  - $(basename "$f")"
            done
            exit 0
          fi

          for name in $MIGRATIONS; do
            f="supabase/migrations/$name"
            case "$name" in */*|*..*) echo "::error::Nombre inválido: $name"; exit 1 ;; esac
            if [ ! -f "$f" ]; then echo "::error::No existe $f en esta rama."; exit 1; fi
            v=$(basename "$name" | cut -d_ -f1)
            if grep -qx "$v" <<<"$APPLIED"; then
              echo "↷ $name ya estaba aplicada (versión $v)."
              continue
            fi
            echo "::group::Aplicando $name"
            run_sql < "$f" >/dev/null
            label=$(basename "$name" .sql | cut -d_ -f2-)
            printf "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('%s', '%s') ON CONFLICT (version) DO NOTHING;" "$v" "$label" | run_sql >/dev/null
            echo "✓ $name aplicada"
            echo "::endgroup::"
          done

  deploy:
    needs: migrate
    if: ${{ inputs.functions != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # El project ref no es secreto: viaja en la URL pública de la API que
          # ya está en js/config.js. Se puede sobrescribir con una repo variable.
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'yskaojvuhaqfmimwmvbi' }}
          # Por env, nunca interpolado dentro del script: ${{ inputs.* }} lo
          # escribe quien dispara el workflow, y sustituirlo en el shell sería
          # inyección de comandos.
          FUNCTIONS_INPUT: ${{ inputs.functions }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN. Añádelo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          FUNCTIONS="${FUNCTIONS_INPUT:-}"
          if [ -z "$FUNCTIONS" ]; then
            FUNCTIONS="enrich-company generate-client-brief generate-radar radar-plan radar-monitor generate-intel-hub generate-outreach generate-coda learning-loop sales-coach campaign-run"
          fi

          # Funciones que en producción corren SIN verificación de JWT porque se
          # autentican solas. Redesplegarlas sin esta bandera les cambia la
          # configuración en silencio: apollo-webhook deja de recibir los avisos
          # de Apollo, y enrich-company cambia cómo la alcanza el onboarding.
          #
          # Con JWT (no listar aquí): channel-connect, apollo-proxy, inbox-send,
          # gmail-proxy, billing, integrations, campaign-run (la llama pg_cron con la service role),
          # api-webhooks (idem).
          NO_JWT="apollo-webhook enrich-company sales-coach wati-webhook meta-whatsapp-webhook dripify-webhook generate-outreach-playbook client-portal stripe-webhook public-api mcp push-send"

          FAILED=""
          for fn in $FUNCTIONS; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::No existe supabase/functions/$fn en esta rama."
              FAILED="$FAILED $fn"
              continue
            fi

            FLAGS=""
            case " $NO_JWT " in
              *" $fn "*) FLAGS="--no-verify-jwt" ;;
            esac

            echo "::group::$fn $FLAGS"
            if npx --yes supabase@latest functions deploy "$fn" --project-ref "$PROJECT_REF" $FLAGS; then
              echo "✓ $fn desplegada"
            else
              echo "::error::Falló el deploy de $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Fallaron:$FAILED"
            exit 1
          fi
          echo "Todas las funciones se desplegaron correctamente."
