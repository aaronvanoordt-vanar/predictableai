<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Predictable.ai — Redirigiendo…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0d1117; color:#aab2bd; font-family:system-ui,sans-serif; font-size:14px; }
  .spinner { width:32px; height:32px; border:3px solid #2d333b; border-top-color:#00c4d4;
             border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .box { text-align:center; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div>Redirigiendo…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script>
(async function () {
  try {
    const { data: { user } } = await window.supabaseClient.auth.getUser();
    if (!user) { window.location.replace('../auth.html'); return; }

    const { data: profile } = await window.supabaseClient
      .from('profiles').select('onboarded').eq('id', user.id).maybeSingle();

    if (profile?.onboarded) {
      window.location.replace('/');
    } else {
      window.location.replace('../onboarding.html');
    }
  } catch (e) {
    window.location.replace('../onboarding.html');
  }
})();
</script>
</body>
</html>
